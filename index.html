function money(v){return v?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v):'Não divulgado'}function mapsUrl(p){return `https://www.google.com/maps?q=${p.lat},${p.lon}&z=17`}function photosFor(p){return (window.PHOTOS&&window.PHOTOS[p.id])||[]}
