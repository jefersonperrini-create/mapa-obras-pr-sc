const map=L.map('map').setView([-25.30,-49.65],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const group=L.layerGroup().addTo(map); let markers=[];
function money(v){return v?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v):'Não divulgado';}
function mapsUrl(p){return `https://www.google.com/maps?q=${p.lat},${p.lon}&z=17`;}
function show(p){
 const pics=p.photos.length?`<div class="photos">${p.photos.map(x=>`<img src="${x}" alt="Foto da obra">`).join('')}</div>`:'';
 document.getElementById('panel').innerHTML=`<div class="card"><h2>${p.name}</h2><div class="meta">${p.city}/${p.uf} • ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
 ${pics}<span class="badge">Prioridade ${p.priority}</span><span class="badge">${p.status}</span>
 <div class="row"><strong>Fase</strong>${p.phase}</div><div class="row"><strong>Investimento</strong>${money(p.investment)}</div>
 <div class="row"><strong>Potencial plataformas</strong>${p.platforms}</div><div class="row"><strong>Potencial geradores</strong>${p.generators}</div>
 <div class="row"><strong>Outros equipamentos</strong>${p.others}</div><div class="row"><strong>Próxima ação comercial</strong>${p.action}</div>
 <div class="row"><strong>Observações</strong>${p.notes}</div><div class="actions"><a href="${mapsUrl(p)}" target="_blank">Abrir no Google Maps</a>${p.source?`<a href="${p.source}" target="_blank">Fonte</a>`:''}</div></div>`;
}
function render(){
 group.clearLayers(); markers=[];
 const pr=document.getElementById('prio').value, st=document.getElementById('status').value;
 const visible=projects.filter(p=>(!pr||p.priority===pr)&&(!st||p.status===st));
 visible.forEach(p=>{
   const m=L.marker([p.lat,p.lon]).addTo(group);
   const photo=p.photos[0]?`<img class="thumb" src="${p.photos[0]}">`:'';
   m.bindTooltip(p.name);
   m.bindPopup(`<div class="pin-title">${p.name}</div>${p.phase}${photo}`);
   m.on('click',()=>show(p)); markers.push(m);
 });
 if(visible.length) map.fitBounds(L.latLngBounds(visible.map(p=>[p.lat,p.lon])).pad(.15));
}
document.getElementById('prio').addEventListener('change',render);document.getElementById('status').addEventListener('change',render);render();
